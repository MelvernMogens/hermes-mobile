name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{SETUP_STEPS}} — language runtime + dependency install
      # {{CHECK_STEPS}} — the project's real typecheck / lint / test commands

      - name: Fail if a secret got committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.pem$|credentials'; then
            echo "::error::A secret or local database file is tracked in git"
            exit 1
          fi
          echo "no secrets tracked"
